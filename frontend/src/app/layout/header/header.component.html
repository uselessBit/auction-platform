<header
  class="animate-fade-in flex h-[var(--header-height)] items-center justify-between border-b border-stroke bg-blocks px-4 py-2 backdrop-blur-md"
>
  <a routerLink="/" class="transition-all duration-300 hover:opacity-80">
    <img src="/assets/images/logo.webp" alt="Логотип SeconDrive" class="h-8" />
  </a>

  <nav
    class="relative flex h-full gap-1 rounded-2xl bg-blocks-second p-2 outline outline-1 outline-stroke"
  >
    <div
      class="pointer-events-none absolute bottom-2 top-2 rounded-lg bg-stroke transition-all duration-300 ease-in-out"
      [style.left.px]="sliderPosition().left"
      [style.width.px]="sliderPosition().width"
      [style.opacity]="sliderPosition().opacity"
    ></div>

    @for (item of navItems; track item.route) {
      <a
        #navItem
        (isActiveChange)="$event ? updateSlider(navItem) : hideSlider(navItem)"
        [routerLink]="item.route"
        routerLinkActive="font-semibold !text-accent"
        [attr.data-text]="item.label"
        class="z-10 flex flex-col items-center justify-center rounded-lg px-4 py-2 text-xs text-text/70 transition-colors duration-300 ease-out after:invisible after:block after:h-0 after:overflow-hidden after:font-semibold after:content-[attr(data-text)] hover:bg-stroke/30 hover:text-text active:bg-stroke/50"
        [routerLinkActiveOptions]="{ exact: true }"
        >{{ item.label }}</a
      >
    }
  </nav>

  @if (isAuthenticated()) {
    <a
      routerLink="/profile"
      tuiButton
      iconStart="/assets/icons/profile.svg"
      appearance="brand"
      routerLinkActive="brand-active"
    >
      Профиль
    </a>
  } @else {
    <button
      type="button"
      tuiButton
      iconStart="/assets/icons/sign-in.svg"
      appearance="brand"
      (click)="openDialog()"
    >
      Войти
    </button>
  }
</header>
