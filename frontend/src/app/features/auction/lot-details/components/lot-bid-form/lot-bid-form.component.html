<div class="flex flex-col gap-4 p-6">
  <div class="flex flex-col gap-2">
    <div class="flex justify-between gap-2">
      <h2 class="text-base font-semibold">Быстрая ставка</h2>
      <div class="chip chip--active inline-flex items-center gap-1.5 font-semibold">
        <span class="size-2 rounded-full bg-active"></span>
        Допуск открыт
      </div>
    </div>

    <div class="grid h-40 grid-cols-2 grid-rows-2 gap-2">
      @for (bid of quickBids(); track bid.label) {
        <button
          type="button"
          class="flex flex-col justify-center rounded-lg border border-stroke bg-blocks-second transition-[background-color,opacity] duration-300 ease-in-out hover:bg-stroke active:opacity-80"
          (click)="onQuickBid(bid.amount)"
        >
          <span class="text-xs opacity-70">{{ bid.label }}</span>
          <span class="text-xl font-semibold">+ <app-currency [value]="bid.amount" /></span>
        </button>
      }
    </div>
  </div>

  <div class="h-px bg-stroke"></div>

  <div class="flex flex-col gap-1">
    <h2 class="text-base font-semibold">Своя ставка</h2>

    <form (ngSubmit)="onCustomBid()" class="flex gap-2">
      <tui-textfield tuiTextfieldSize="s" class="flex-1" tuiTextfieldAppearance="brand-input">
        <input
          [placeholder]="'От ' + (minBid() | number: '1.0-0') + ' BYN'"
          tuiInputNumber
          [formControl]="amountControl"
          [max]="1000000000"
        />
      </tui-textfield>

      <button type="submit" tuiButton appearance="brand" [disabled]="isSubmitDisabled()">
        Поставить
      </button>
    </form>
  </div>
</div>
