<button
  tuiButton
  appearance="brand-rounded"
  [iconStart]="isFavorite() ? 'assets/icons/star-active.svg' : 'assets/icons/star.svg'"
  [class.brand-rounded-active]="isFavorite()"
  [attr.aria-pressed]="isFavorite()"
  aria-label="В избранное"
  (click)="toggleState($event)"
  type="button"
></button>
