<button
  tuiButton
  appearance="brand-rounded"
  [iconStart]="isFavorite() ? 'assets/icons/star-active.svg' : 'assets/icons/star.svg'"
  [class]="isFavorite() ? 'border-accent bg-accent' : 'border-stroke bg-blocks'"
  (click)="toggleState($event)"
  aria-label="Add to favorite button"
>
</button>
