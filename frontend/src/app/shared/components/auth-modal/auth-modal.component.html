<dialog
  #dlg
  class="overflow-visible border-none bg-transparent p-0 backdrop:bg-black/80 backdrop:backdrop-blur-lg"
  [class.is-closing]="isClosing()"
  (animationend)="onAnimationEnd($event)"
  (close)="onClose()"
  (click)="onBackdropClick($event)"
  (mousedown)="onBackdropMousedown($event)"
  (keydown.escape)="$event.preventDefault(); close()"
  (cancel)="$event.preventDefault(); close()"
  tabindex="-1"
  autofocus
>
  @if (isOpen()) {
    @for (currentMode of [mode()]; track currentMode) {
      <div
        class="dialog-stage relative flex flex-col gap-4 rounded-[2rem] border border-stroke bg-blocks p-6"
        [class.is-switching]="isSwitching()"
        (animationend)="onStageAnimationEnd($event)"
      >
        <h2 class="px-12 py-1 text-center text-base font-semibold">{{ title() }}</h2>

        @switch (mode()) {
          @case ('login') {
            <app-login-form
              [isLoading]="isLoading()"
              (loginSubmitted)="onLogin($event)"
              (switchToRegister)="switchMode('register')"
            />
          }
          @case ('register') {
            <app-register-form
              [isLoading]="isLoading()"
              (registerSubmitted)="onRegister($event)"
              (switchToLogin)="switchMode('login')"
            />
          }
          @case ('verify') {
            <app-verify-codes-form
              (closeModal)="close()"
              [email]="currentUser()?.email ?? ''"
              [phone]="currentUser()?.phone ?? ''"
              [isLoading]="isLoading()"
              [fieldErrors]="verifyFieldErrors()"
              (verifySubmitted)="onVerify($event)"
              (resendRequested)="onResendCode($event)"
              [isUpdatingContact]="isUpdatingContact()"
              (contactChanged)="onUpdateContact($event)"
            />
          }
        }

        <div class="absolute right-6 top-6">
          <button
            tuiButton
            type="button"
            appearance="brand-flat"
            iconStart="/assets/icons/x.svg"
            (click)="close()"
            aria-label="Закрыть"
          ></button>
        </div>
      </div>
    }
  }
  <tui-popups />
</dialog>
