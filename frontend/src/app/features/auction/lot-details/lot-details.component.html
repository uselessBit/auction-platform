@if (lot$ | async; as lot) {
  <section
    class="animate-fade-in mx-auto my-6 grid w-full max-w-layout grid-flow-row grid-cols-3 gap-6 px-6"
  >
    <div class="col-span-2 flex flex-col gap-6">
      <app-lot-gallery [lot]="lot"></app-lot-gallery>
      @if (lot.bids.length > 1) {
        <app-lot-price-chart [lot]="lot"></app-lot-price-chart>
      }
      @if (lot.status === 'active' || lot.status === 'finished' || lot.status === 'sold') {
        <app-lot-specs [lot]="lot"></app-lot-specs>
      }
    </div>

    <div
      class="sticky top-[calc(var(--header-height)+1.5rem)] col-span-1 flex flex-col gap-6 self-start"
    >
      <app-lot-bid-summary [lot]="lot"></app-lot-bid-summary>
      @if (lot.status === 'upcoming' || lot.status === 'cancelled') {
        <app-lot-specs [lot]="lot"></app-lot-specs>
      }
      @if (lot.status === 'active') {
        <app-lot-bid-panel [lot]="lot"></app-lot-bid-panel>
      }
      @if (lot.bids.length > 0) {
        <app-lot-bids-list [bids]="lot.bids" [status]="lot.status"></app-lot-bids-list>
      }
    </div>
  </section>
}
