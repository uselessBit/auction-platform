<article class="flex flex-col gap-4 rounded-[2rem] bg-blocks p-6 outline outline-1 outline-stroke">
  <div class="flex flex-col gap-1">
    <h2 class="text-base font-semibold">Быстрая ставка</h2>

    <div class="grid h-40 grid-cols-2 grid-rows-2 gap-2">
      @for (bid of quickBids(); track bid.label) {
        <button
          type="button"
          class="flex flex-col justify-center rounded-lg border border-stroke bg-blocks-second transition-[background-color] duration-300 ease-in-out hover:bg-stroke"
        >
          <span class="text-xs opacity-70">{{ bid.label }}</span>
          <span class="text-xl font-semibold">+ <app-currency [value]="bid.amount" /></span>
        </button>
      }
    </div>
  </div>

  <div class="h-px bg-stroke"></div>

  <div class="flex flex-col gap-1">
    <h2 class="text-base font-semibold">Своя ставка</h2>

    <div class="flex gap-2">
      <tui-textfield tuiTextfieldSize="s" class="flex-1" tuiTextfieldAppearance="brand-input">
        <input
          [placeholder]="'От ' + (minBid() | number: '1.0-0') + ' BYN'"
          tuiInputNumber
          [formControl]="amountControl"
          [max]="1000000000"
        />
      </tui-textfield>

      <button tuiButton appearance="brand" [disabled]="amountControl.invalid">Поставить</button>
    </div>
  </div>
</article>
