<div
  class="inline-flex items-center gap-1 rounded-lg border px-2 py-1 text-xs font-semibold shadow-md shadow-black/25 backdrop-blur-sm"
  [class]="badgeClass()"
>
  <tui-icon
    [icon]="'/assets/icons/' + status() + '.svg'"
    class="text-xs"
    [class.animate-pulse]="status() === 'active'"
  />
  <span>{{ lotStatus() }}</span>
</div>
