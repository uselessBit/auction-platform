<section class="mx-auto my-6 grid w-full max-w-layout grid-flow-row grid-cols-3 gap-6 px-6">
  @if (lots$ | async; as lots) {
    @for (lot of lots; track lot.id) {
      <app-lot-card [lot]="lot"></app-lot-card>
    }
  } @else {
    @for (i of [1, 2, 3, 4, 5, 6]; track i) {
      <app-lot-card></app-lot-card>
    }
  }
</section>
