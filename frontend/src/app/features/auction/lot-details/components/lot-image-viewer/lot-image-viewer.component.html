<dialog
  #dlg
  class="h-full w-full bg-transparent backdrop:bg-black/80 backdrop:backdrop-blur-lg"
  (close)="close()"
  (click)="onBackdropClick($event)"
  (keydown.arrowLeft)="prev()"
  (keydown.arrowRight)="next()"
  (mousemove)="isZoom() && mousemove($event)"
  (mouseup)="isZoom() && mouseup()"
  (mouseleave)="mouseup()"
  tabindex="-1"
>
  @if (isOpen()) {
    <div
      class="pointer-events-none relative flex h-full w-full flex-col items-center justify-between"
    >
      <div
        class="pointer-events-auto z-10 flex w-full max-w-dialog items-center justify-between gap-1 rounded-2xl border border-stroke bg-blocks p-2 backdrop-blur-md"
      >
        <h2 class="pl-2 text-lg font-bold">
          {{ title() }}
        </h2>

        <div class="flex gap-2">
          <button
            tuiButton
            appearance="brand-square"
            type="button"
            iconStart="/assets/icons/zoom-out.svg"
            [disabled]="!isZoom()"
            aria-label="Отдалить"
            (click)="zoomOut()"
          ></button>

          <div class="chip flex items-center justify-center opacity-70">
            {{ currentScale() * 100 }}%
          </div>

          <button
            tuiButton
            appearance="brand-square"
            type="button"
            iconStart="/assets/icons/zoom-in.svg"
            [disabled]="currentScale() >= maxScale"
            aria-label="Приблизить"
            (click)="zoomIn()"
          ></button>

          <button
            tuiButton
            appearance="brand-square"
            type="button"
            iconStart="/assets/icons/x.svg"
            aria-label="Закрыть"
            (click)="close()"
          ></button>
        </div>
      </div>

      <div class="fixed inset-0 overflow-hidden">
        <div
          class="flex h-full w-full py-24 transition-transform duration-300 ease-in-out"
          [style.transform]="'translateX(-' + index() * 100 + '%)'"
        >
          @for (image of images(); track image) {
            <div class="flex h-full w-full shrink-0 items-center justify-center">
              <img
                [src]="image"
                [alt]="'Фото ' + ($index + 1)"
                [style.scale]="$index === index() ? currentScale() : 1"
                [style.translate]="
                  $index === index() && isZoom()
                    ? imagePan().x + 'px ' + imagePan().y + 'px'
                    : '0px 0px'
                "
                draggable="false"
                (mousedown)="isZoom() && mousedown($event)"
                [class.cursor-grab]="isZoom() && !isDragging()"
                [class.cursor-grabbing]="isDragging()"
                [class.transition-none]="isDragging()"
                class="animate-fade-in border-solid pointer-events-auto max-h-full max-w-full rounded-2xl border border-stroke object-contain transition-[scale,translate] duration-300"
              />
            </div>
          }
        </div>
      </div>

      <div
        class="pointer-events-auto z-10 flex w-fit gap-0.5 overflow-x-auto rounded-2xl border border-stroke bg-blocks p-2 backdrop-blur-md"
      >
        @for (img of images(); track $index) {
          <button
            type="button"
            (click)="navChangeIndex($index)"
            class="group aspect-[4/3] w-16 shrink-0 overflow-hidden rounded-lg border border-solid p-0.5 transition-[border-color,transform] duration-300 hover:scale-105"
            [class.border-accent]="$index === index()"
            [class.border-transparent]="$index !== index()"
            [class.scale-105]="$index === index()"
          >
            <div class="relative h-full w-full">
              <img
                [ngSrc]="img"
                fill
                alt=""
                class="rounded-md object-cover transition-opacity duration-300 group-hover:opacity-90"
                [class.opacity-50]="$index !== index()"
              />
            </div>
          </button>
        }
      </div>

      @if (!isZoom()) {
        <div class="absolute inset-y-0 z-10 flex w-full items-center justify-between px-6">
          <button
            tuiButton
            appearance="brand-rounded"
            type="button"
            iconStart="/assets/icons/arrow-left.svg"
            aria-label="Предыдущее фото"
            [disabled]="index() === 0"
            class="pointer-events-auto"
            (click)="prev()"
          ></button>

          <button
            tuiButton
            appearance="brand-rounded"
            type="button"
            iconStart="/assets/icons/arrow-right.svg"
            aria-label="Следующее фото"
            [disabled]="index() === images().length - 1"
            class="pointer-events-auto"
            (click)="next()"
          ></button>
        </div>
      }
    </div>
  }
</dialog>
