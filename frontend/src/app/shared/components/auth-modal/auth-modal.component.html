<dialog
  #dlg
  class="border-none bg-transparent p-0 backdrop:bg-black/80 backdrop:backdrop-blur-lg"
  [class.is-closing]="isClosing()"
  (animationend)="onAnimationEnd($event)"
  (close)="onClose()"
  (click)="onBackdropClick($event)"
  (mousedown)="onBackdropMousedown($event)"
  (keydown.escape)="$event.preventDefault(); close()"
  (cancel)="$event.preventDefault(); close()"
  tabindex="-1"
  autofocus
>
  @if (isOpen()) {
    <div
      class="dialog-stage relative flex flex-col gap-4 rounded-[2rem] border border-stroke bg-blocks p-6"
    >
      <h2 class="px-8 text-center text-base font-semibold">{{ title() }}</h2>
      @switch (mode()) {
        @case ('login') {
          <app-login-form
            [isLoading]="isLoading()"
            (loginSubmitted)="onLogin($event)"
            (switchToRegister)="switchMode('register')"
          />
        }
        @case ('register') {
          <app-register-form />
        }
        @case ('verify') {
          <app-verify-codes-form />
        }
      }

      <div class="absolute right-4 top-4">
        <button
          tuiButton
          type="button"
          appearance="brand-rounded-flat"
          iconStart="/assets/icons/x.svg"
          (click)="close()"
          (mousedown)="$event.preventDefault()"
        ></button>
      </div>
    </div>
  }
  <tui-popups />
</dialog>
