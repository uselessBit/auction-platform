<article class="flex flex-col gap-2 rounded-[2rem] bg-blocks p-6 outline outline-1 outline-stroke">
  <h2 class="text-base font-semibold">Список ставок</h2>

  <div class="flex flex-col gap-2">
    @for (bid of bids(); track bid.id) {
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <div
            class="flex size-8 items-center justify-center rounded-lg border border-stroke bg-blocks-second"
            [class]="iconClass()"
          >
            <tui-icon icon="/assets/icons/profile.svg" class="text-xs" />
          </div>

          <div class="inline-flex flex-col text-xs">
            <span>Участник {{ bid.userId | mask: 4 : 3 }} </span>
            <span class="text-text/50">{{ bid.createdAt | date: 'dd.MM.yyyy HH:mm:ss' }}</span>
          </div>
        </div>

        <div class="text-xl font-semibold">
          <app-currency [value]="bid.amount" [color]="status()" />
        </div>
      </div>

      @if (!$last) {
        <div class="min-h-px bg-stroke"></div>
      }
    }
  </div>
</article>
