<dialog
  #dlg
  class="border-none bg-transparent p-0 backdrop:bg-black/80 backdrop:backdrop-blur-lg"
  [class.is-closing]="isClosing()"
  (animationend)="onAnimationEnd($event)"
  (close)="onClose()"
  (click)="onBackdropClick($event)"
  (mousedown)="onBackdropMousedown($event)"
  (keydown.escape)="$event.preventDefault(); close()"
  (cancel)="$event.preventDefault(); close()"
  tabindex="-1"
  autofocus
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div
      class="dialog-stage relative flex flex-col gap-4 rounded-[2rem] border border-stroke bg-blocks p-6"
    >
      <h2 class="px-8 text-center text-base font-semibold">Вход в аккаунт</h2>

      <div class="flex flex-col">
        <tui-textfield
          #email
          tuiTextfieldSize="s"
          class="w-64"
          tuiTextfieldAppearance="brand-input"
        >
          <input
            [placeholder]="email.focused() ? 'example@gmail.com' : 'Email'"
            tuiInput
            type="email"
            formControlName="email"
            aria-label="Email"
          />
        </tui-textfield>

        <tui-error formControlName="email" />
      </div>

      <div>
        <tui-textfield tuiTextfieldSize="s" class="w-64" tuiTextfieldAppearance="brand-input">
          <input
            placeholder="Пароль"
            tuiInput
            type="password"
            formControlName="password"
            aria-label="Пароль"
          />
          <tui-icon tuiPassword />
        </tui-textfield>

        <tui-error formControlName="password" />
      </div>

      <button type="submit" tuiButton appearance="brand" [loading]="isLoading()" class="flex-1">
        Войти
      </button>

      <button
        type="button"
        tuiButton
        appearance="brand-transparent"
        class="group flex-1"
        iconEnd="/assets/icons/arrow-small-right.svg"
      >
        Нет аккаунта?
        <span class="duration-200 ease-out transition-colors group-hover:text-accent">Зарегистрироваться</span>
      </button>

      <div class="absolute right-4 top-4">
        <button
          tuiButton
          type="button"
          appearance="brand-rounded-flat"
          iconStart="/assets/icons/x.svg"
          (click)="close()"
          (mousedown)="$event.preventDefault()"
        ></button>
      </div>
    </div>
  </form>

  <tui-popups />
</dialog>
